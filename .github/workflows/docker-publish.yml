name: Publish Docker images

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm publication of both application images to GHCR
        type: boolean
        required: true
        default: false
      api_base_url:
        description: Public HTTPS API base URL, ending in /api/v1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == true && inputs.api_base_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository and frontend
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Normalize image owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Validate frontend API URL
        id: api
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["API_BASE_URL"]
          if any(character.isspace() or ord(character) < 32 for character in value):
              raise SystemExit("API URL must not contain whitespace or control characters")
          parsed = urlsplit(value)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path.rstrip("/") != "/api/v1"
          ):
              raise SystemExit("API URL must be an HTTPS origin ending in /api/v1")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"url={value}\n")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        id: backend
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/djibexa-backend:${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and publish frontend image
        id: frontend
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.api.outputs.url }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/djibexa-frontend:${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Report published image references
        env:
          BACKEND_IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/djibexa-backend
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/djibexa-frontend
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            echo "## Published Docker images"
            echo
            echo "| Image | Commit tag | Digest |"
            echo "|---|---|---|"
            echo "| \`$BACKEND_IMAGE:${GITHUB_SHA}\` | \`$GITHUB_SHA\` | \`$BACKEND_DIGEST\` |"
            echo "| \`$FRONTEND_IMAGE:${GITHUB_SHA}\` | \`$GITHUB_SHA\` | \`$FRONTEND_DIGEST\` |"
            echo
            echo "Both images include BuildKit provenance and an SBOM. No deployment was performed."
          } >> "$GITHUB_STEP_SUMMARY"
