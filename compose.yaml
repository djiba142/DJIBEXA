services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - nexora-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: djibexa-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      MEDIA_ROOT: /var/data/media
      PRIVATE_INVOICE_ROOT: /var/data/private-invoices
      PRIVATE_STOREFRONT_ROOT: /var/data/private-storefronts
      PRIVATE_SUPPLIER_IMPORT_ROOT: /var/data/private-supplier-imports
    volumes:
      - nexora-files:/var/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        exec gunicorn nexora_backend.wsgi:application
        --bind 0.0.0.0:8000
        --workers "$${GUNICORN_WORKERS:-2}"
        --timeout 120
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/healthz/', timeout=3); exit(0 if response.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: djibexa-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000/api/v1}"
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  nexora-db:
  nexora-files:
