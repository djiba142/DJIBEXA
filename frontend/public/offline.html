<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10243A" />
    <meta name="robots" content="noindex" />
    <title>DJIBEXA — Connexion indisponible</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #202b38;
        background: #f5f7fa;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1rem;
        place-items: center;
      }
      main {
        width: min(100%, 32rem);
        box-sizing: border-box;
        padding: clamp(1.25rem, 5vw, 2rem);
        border: 1px solid #dce3eb;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 2.5rem #10243a12;
      }
      h1 {
        margin: 0;
        color: #10243a;
        font-size: clamp(1.5rem, 6vw, 2rem);
      }
      p {
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        padding: 0 1rem;
        border-radius: 0.5rem;
        background: #174a78;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #54a6f5;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/djibexa-icon-192.png" width="48" height="48" alt="" />
      <h1>Connexion indisponible</h1>
      <p>
        DJIBEXA ne peut pas joindre le serveur pour le moment. Vérifiez votre
        connexion, puis réessayez. Aucune vente, réception ou opération financière
        n’a été enregistrée hors ligne.
      </p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
